<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
    <div class="menu-section"> <!--Creates a container with the class name "menu-section". This div holds the entire dropdown menu and helps us position it with CSS.-->
        <select id="game-menu">  <!--Creates a dropdown menu element with the id "game-menu". The select tag makes a dropdown list that users can click to see options. The id lets JavaScript find this specific menu.-->
            <option value="">⚙️ Menu</option>  <!--Creates the first option in the dropdown with an empty value (value=""). The ⚙️ emoji and "Menu" text is what the user sees. This is the default option that shows when nothing is selected.-->
            <option value="main">🏠 Back to Main Menu</option>  <!--Creates the second option with the value "main". When the user clicks this, JavaScript can check if value === "main" and knows to go back to the main menu. The 🏠 emoji and text is what displays.-->
            <option value="restart">🔄 Restart Game</option>  <!--Creates the third option with the value "restart". When selected, JavaScript knows to restart the current game. The 🔄 emoji and text shows to the user.-->
        </select>
    </div>
    
    <div class="game-container">
        <h1>Word Scramble Game</h1>
        
        <div class="difficulty-section">
            <h2>Choose Difficulty:</h2>
            <button id="easy-btn">Easy (1 point)</button>
            <button id="medium-btn">Medium (2 points)</button>
            <button id="hard-btn">Hard (3 points)</button>
        </div>
        
        <div class="game-section" id="game-section">
        <div class="timer">Time: <span id="time-left">60</span> seconds</div>
        <div class="score">Score: <span id="current-score">0</span></div>


            
            <div class="scrambled-word">
                <h3>Unscramble this word:</h3>
                <div id="scrambled-display">Click a difficulty to start!</div>
            </div>
            


            <div class="input-section">
                <input type="text" id="user-answer" placeholder="Type your answer here">
                <button id="submit-btn">Submit</button>
                <button id="skip-btn">Skip Word</button>
            </div>
            
            <div class="feedback" id="feedback-message"></div>
        </div>
        
        <div class="game-over">
            <h2 id="final-message">Game Over!</h2>
            <div id="final-score">Final Score: 0</div>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>


  
</div>



    <script src="script.js"></script>
</body>
</html>
